<html lang="en">
<meta charset="utf-8">

<style>
:root{--ink:#0E1C36;--ink2:#39455E;--ink3:#55617A;--pri:#17457C;--priD:#0F3260;--priT:#E7EFF8;
--ok:#0B6A4D;--okT:#E0EFE9;--warn:#8A5300;--warnT:#FAF0DD;--bad:#9E211B;--badT:#FBE6E4;--saf:#B85C00;
--bg:#F4F6FA;--card:#fff;--line:#D6DDE8;--line2:#EBEEF4;
--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;--sh:0 1px 2px rgba(14,28,54,.06),0 4px 16px rgba(14,28,54,.06)}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px;border-radius:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;background:#fff;padding:10px 16px;z-index:300;font-weight:600}.skip:focus{left:0;top:0}
.bar{position:sticky;top:0;z-index:80;background:var(--ink);color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px;min-height:54px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
.em{width:26px;height:26px;border-radius:5px;background:#fff;color:var(--ink);display:grid;place-items:center;font:700 11px var(--mono)}
.brand small{display:block;font:400 10px var(--sans);color:#A6B4CE;text-transform:uppercase;letter-spacing:.05em}
.nav{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:8px;overflow-x:auto}
.nav button{padding:6px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:#CBD5E8;white-space:nowrap}
.nav button[aria-current=page]{background:#fff;color:var(--ink);font-weight:600}
.barR{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.28);border-radius:20px;padding:3px 10px 3px 4px;font-size:12px}

.ib{border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:5px 9px;font:500 11.5px var(--mono);color:#E1E8F3;position:relative}

.sess{background:var(--warnT);color:var(--warn);font-size:12px;padding:6px 14px;text-align:center;font-weight:600}
.wrap{max-width:1440px;margin:0 auto;padding:18px 14px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh)}
.pad{padding:15px}.muted{color:var(--ink3)}.mono{font-family:var(--mono)}
.eye{font:600 10.5px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
h1.pg{font-size:22px;margin:3px 0 4px;letter-spacing:-.02em}h2.sec{font-size:17px;margin:0 0 11px;letter-spacing:-.015em}
.lede{color:var(--ink2);max-width:80ch;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

table{width:100%;border-collapse:collapse;font-size:12.5px}

.okbox{border-left:3px solid var(--ok);background:var(--okT);border-radius:0 8px 8px 0;padding:11px 13px;font-size:12.5px;margin-top:10px}

.tl{position:relative;padding-left:18px}

.tl .s.cur:before{background:var(--pri);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--priT)}

.ledger .DENY,.ledger .SECURITY{background:var(--badT)}
.mx td,.mx th{text-align:center;font-size:12px;padding:5px 4px}
.mx td:first-child,.mx th:first-child{text-align:left;font-family:var(--mono);font-size:11.5px}
.y{color:var(--ok);font-weight:700}.n{color:#C9D0DC}
.bar2{height:8px;border-radius:4px;background:#E4E9F0;overflow:hidden;margin:4px 0}
.bar2 i{display:block;height:100%;background:var(--ok)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:200;transition:transform .2s;box-shadow:0 8px 28px rgba(14,28,54,.3);max-width:90vw}
.toast.on{transform:translateX(-50%) translateY(0)}.toast.bad{background:var(--bad)}
.modal{position:fixed;inset:0;background:rgba(14,28,54,.55);z-index:250;display:none;place-items:center;padding:20px}
.modal.on{display:grid}.modal .box{background:#fff;border-radius:12px;width:min(680px,100%);max-height:88vh;overflow:auto}
.modal .h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff}
@media print{

 .wrap{max-width:none;padding:0}
 .card{border:1px solid #999;box-shadow:none;break-inside:avoid}
 .side{grid-template-columns:1fr}
 table{font-size:9.5pt}
 .note,.deny,.okbox{border-left:3px solid #333;background:#fff}
 h1.pg{page-break-after:avoid}

@media(max-width:900px){.side{grid-template-columns:1fr}.snav{position:static;max-height:none}.g2{grid-template-columns:1fr}}
</style>

/* ═══ STATISTICS. Everything the certificate carries is computed from raw results. ═══ */
const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sd=a=>{const m=mean(a);return a.length<2?0:Math.sqrt(a.reduce((x,y)=>x+(y-m)*(y-m),0)/(a.length-1))};
/* One-way ANOVA over units. u(bb) is the between-unit standard deviation, floored at the
   detection limit when MS(between) falls below MS(within) — the conventional treatment. */
function anova(rows){
 const units=[...new Set(rows.map(r=>r.u))];
 const groups=units.map(u=>rows.filter(r=>r.u===u).map(r=>r.v));
 const reps=groups[0].length, all=rows.map(r=>r.v), gm=mean(all);
 const msB=groups.reduce((a,g)=>a+reps*Math.pow(mean(g)-gm,2),0)/(units.length-1);
 const msW=groups.reduce((a,g)=>a+g.reduce((x,v)=>x+Math.pow(v-mean(g),2),0),0)/(all.length-units.length);
 const sbb2=(msB-msW)/reps;
 const sbb=sbb2>0?Math.sqrt(sbb2):Math.sqrt(msW/reps)*Math.pow(2/((units.length-1)*(reps-1)||1),0.25);
 return{units:units.length,reps,gm,msB,msW,sbb,ubb:sbb,floored:sbb2<=0};
}
/* Least squares over time. u(lts) is the standard error of the slope projected across
   the shelf life, which is how ISO Guide 35 treats long-term stability. */
function regress(pts,shelfMonths){
 const x=pts.map(p=>p.m),y=pts.map(p=>p.v),n=x.length,mx=mean(x),my=mean(y);
 const sxx=x.reduce((a,v)=>a+(v-mx)*(v-mx),0);
 const slope=x.reduce((a,v,i)=>a+(v-mx)*(y[i]-my),0)/sxx;
 const inter=my-slope*mx;
 const resid=y.map((v,i)=>v-(inter+slope*x[i]));
 const se2=resid.reduce((a,v)=>a+v*v,0)/(n-2);
 const seSlope=Math.sqrt(se2/sxx);
 return{n,slope,inter,seSlope,ults:seSlope*shelfMonths,significant:Math.abs(slope)>2*seSlope,shelfMonths};
}
/* Consensus across laboratories. Produces u(char) AND the assigned value. */
function consensus(rows){
 const v=rows.map(r=>r.v),m=mean(v),s=sd(v);
 return{labs:v.length,value:m,s,uchar:s/Math.sqrt(v.length)};
}
function studyStats(st){
 const raw=DB.results[st.id];if(!raw||!raw.length)return null;
 if(st.type==='homogeneity')return{kind:'bb',...anova(raw),u:anova(raw).ubb};
 if(st.type==='stability'){
  const months=st.shelf?Math.max(1,Math.round((new Date(st.shelf)-new Date(st.at||TODAY))/2592000000)):24;
  const r=regress(raw,months);return{kind:'lts',...r,u:r.ults};}
 const c=consensus(raw);return{kind:'char',...c,u:c.uchar};
}
/* ─── uncertainty budget, derived from signed studies ─── */
function budget(prjId){
 const st=DB.studies.filter(s=>s.prj===prjId&&s.state==='signed');
 const g=t=>{const x=st.find(s=>s.type===t);if(!x)return null;const q=studyStats(x);return q?q.u:null};
 const uBb=g('homogeneity'),uLts=g('stability'),uChar=g('characterisation');
 const parts=[uBb,uLts,uChar].filter(x=>x!=null);
 const uc=parts.length?Math.sqrt(parts.reduce((a,x)=>a+x*x,0)):null;
 return{uBb,uLts,uChar,uc,complete:uBb!=null&&uLts!=null&&uChar!=null};
}

function assignedValue(prjId){

function components(prjId){

 stepUp('Sign study '+id,'study',(meaning)=>{

 });

function monitoringDue(){
 const out=[];
 DB.studies.filter(x=>x.type==='stability'&&x.state==='signed').forEach(x=>{
  const last=x.lastCheck||x.at,next=x.nextCheck||addMonths(last,6);
  out.push({study:x.id,prj:x.prj,mat:prj(x.prj).mat,last,next,overdue:next<TODAY});
 });
 return out.sort((a,b)=>a.next<b.next?-1:1);
}
function addMonths(d,m){const x=new Date(d);x.setMonth(x.getMonth()+m);return x.toISOString().slice(0,10)}
function recordCheck(sid){
 tryDo(()=>{const x=DB.studies.find(y=>y.id===sid);
  guard('study:run');
  x.lastCheck=TODAY;x.nextCheck=addMonths(TODAY,6);
  audit('WORKFLOW','Stability monitoring point recorded',sid+' · next due '+x.nextCheck);
  toast(sid+' checked, next due '+x.nextCheck);});
}

function selfCheck(){
 const R=[];const t=(n,ok,d)=>R.push({n,ok:!!ok,d:d||''});
 const permsUsed=new Set(Object.values(ROLES).flatMap(r=>r.p));
 t('every granted permission is defined',[...permsUsed].every(x=>x in PERMS),
   [...permsUsed].filter(x=>!(x in PERMS)).join(', '));
 const routed=Object.keys({projects:1,studies:1,values:1,authorise:1,lots:1,certs:1,catalogue:1,orders:1,
   entitlement:1,dispatch:1,conformance:1,monitoring:1,retention:1,equipment:1,competence:1,subs:1,capa:1,
   audit:1,trace:1,security:1,tenant:1,users:1,build:1});
 const mods=[];MODS.forEach(([g,ms])=>ms.forEach(m=>mods.push(m[0])));
 t('every sidebar module has a renderer',mods.every(m=>routed.includes(m)),mods.filter(m=>!routed.includes(m)).join(', '));
 t('every SoD rule guards a defined permission',SOD_RULES.every(r=>r.action in PERMS),
   SOD_RULES.filter(r=>!(r.action in PERMS)).map(r=>r.id).join(', '));
 const vc=verifyChain();t('audit chain verifies',vc.ok,vc.ok?'':'broken at entry '+vc.at);
 t('every order line references an existing lot',
   DB.orders.every(o=>o.lines.every(l=>!!lotById(l.lot))),'');
 t('every vault holding references an existing lot',DB.vault.every(v=>!!lotById(v.lot)),'');
 t('every study references existing equipment',
   DB.studies.every(s=>s.eq.every(e=>DB.equipment.some(x=>x.id===e))),'');
 t('every lot belongs to a real project',DB.lots.every(l=>!!prj(l.prj)),'');
 t('every competence record names a real user and activity',
   DB.competence.every(c=>!!userById(c.p)&&(c.act in PERMS)),'');
 const signed=DB.studies.filter(x=>x.state==='signed');
 t('every signed study carries a valid competence basis',signed.every(x=>basisValid(x.basis)),
   signed.filter(x=>!basisValid(x.basis)).map(x=>x.id).join(', '));
 const bound=DB.studies.filter(x=>x.sig);
 t('every bound study signature still verifies',bound.every(x=>verifySignature('study',x,x.sig).ok),
   bound.filter(x=>!verifySignature('study',x,x.sig).ok).map(x=>x.id).join(', '));
 const ci=DB.certs.flatMap(c=>c.issues.filter(i=>i.sig).map(i=>({c,i})));
 t('every bound certificate signature still verifies',
   ci.every(({c,i})=>verifySignature('cert',{id:c.id,lot:c.lot,val:i.val,U:i.U},i.sig).ok),
   ci.filter(({c,i})=>!verifySignature('cert',{id:c.id,lot:c.lot,val:i.val,U:i.U},i.sig).ok).map(({c})=>c.id).join(', '));
 t('every certificate belongs to a real lot',DB.certs.every(c=>!!lotById(c.lot)),'');
 t('every listed lot has a current, unwithdrawn certificate',
   DB.lots.filter(l=>l.state==='released').every(l=>{const c=certForLot(l.id);return c&&!c.issues[c.issues.length-1].withdrawn}),'');
 t('every uncertainty component derives from raw data',
   DB.projects.every(pr=>components(pr.id).every(c=>c.value>0)),'');
 t('coverage map classifies every row',COVERAGE.every(c=>['built','partial','not built','n/a'].includes(c[2])),'');
 return R;
}

 ['Study and property value','ISO 17034 §7.5–7.8','Life of the material + 5 years','Indefinite','Scientific record, not personal data'],
 ['Certificate issue','ISO Guide 31 · Part 11','Life of the lot + 10 years','Indefinite','Every issue retained; reissue never overwrites'],
 ['Order and allocation','Tax law · ISO 17034 §7.10','8 years','8 years','Needed to compute the certificate holder list'],
 ['Customer contact data','DPDP Act 2023','While the purpose is live','Purpose end + 90 days','Minimised: erased once no order or entitlement is open'],
 ['Consent artefact','DPDP Rules 2025','Life of consent + 3 years','As above','Evidence that processing was lawful outlives the consent itself'],
 ['Competence record','ISO 17034 §6.3','Life of every signature it backs','Indefinite','Cannot be deleted; superseding is an edit, not a removal'],
 ['Session and access log','CERT-In 2022','180 days, in India','13 months','Security telemetry, no scientific value beyond a year']];

const cartTotal=()=>Object.keys(DB.cart).reduce((a,k)=>a+unitPrice(lotById(k))*DB.cart[k],0);
function addCart(id){tryDo(()=>{guard('order:create');const l=lotById(id);
 if(l.stock<(DB.cart[id]||0)+1)throw new Forbidden('Only '+l.stock+' units available.');
 DB.cart[id]=(DB.cart[id]||0)+1;audit('CART','Added to cart',l.lot);toast('Added')})}
function placeOrder(){tryDo(()=>{guard('order:create');
 const lines=Object.keys(DB.cart).map(k=>({lot:k,q:DB.cart[k],unit:unitPrice(lotById(k))}));
 if(!lines.length)throw new Forbidden('The cart is empty.');
 /* Validate every line BEFORE mutating anything, then apply with a rollback if any step fails. */
 for(const l of lines){
  const lot=lotById(l.lot);
  if(!lot)throw new Forbidden('A cart line refers to a lot that no longer exists.');
  if(lot.state!=='released')throw new Forbidden(lot.lot+' is no longer released for sale.');
  if(!certForLot(lot.id))throw new Forbidden(lot.lot+' has no current certificate.');
  if(lot.stock<l.q)throw new Forbidden('Only '+lot.stock+' units of '+lot.lot+' remain.');
 }
 const applied=[];
 try{
  for(const l of lines){lotById(l.lot).stock-=l.q;applied.push(l)}
  const id='ORD-'+(3301+DB.orders.length);
  DB.orders.unshift({id,org:S.user.org,by:S.user.id,lines,total:cartTotal(),state:'placed',placed:TODAY,courier:'—',version:1});
  lines.forEach(l=>{if(!DB.vault.some(v=>v.org===S.user.org&&v.lot===l.lot))DB.vault.push({org:S.user.org,lot:l.lot,loc:'Unassigned',qty:l.q})});
  DB.cart={};audit('ORDER','Order placed',id+' · '+lines.length+' line(s)');
  notify(S.user.id,'Order placed',id+' confirmed. The certificate is in your vault.');
  toast(id+' placed');S.route='orders';
 }catch(err){
  applied.forEach(l=>{lotById(l.lot).stock+=l.q});
  audit('ORDER','Order placement rolled back',String(err.message||err));
  throw err;
 }})}

/* Forty-one tables had one caption between them. Every table is labelled after render
   from its nearest preceding heading, so the coverage cannot drift again. */
function labelTables(){
 const root=document.getElementById('app');if(!root)return 0;
 let added=0;
 root.querySelectorAll('table').forEach(t=>{
  if(t.querySelector('caption'))return;
  let n=t,label='',hops=0;
  while(n&&!label&&hops<40){
   hops++;
   n=n.previousElementSibling||n.parentElement;
   if(!n||!n.querySelector)break;
   if(n.matches&&n.matches('h1,h2,h3,.eye')&&n.textContent.trim())label=n.textContent.trim();
   else{const h=n.querySelector('h2.sec,h1.pg,.eye');if(h&&h.textContent.trim())label=h.textContent.trim();}
  }
  const cap=document.createElement('caption');cap.className='sr';
  cap.textContent=(label||'Data table')+' — '+t.querySelectorAll('tbody tr').length+' rows';
  t.insertBefore(cap,t.firstChild);added++;
 });
 return added;
}

DB.studies.filter(x=>x.state==='signed'&&x.by&&x.at&&!x.basis).forEach(x=>{
 const rec=competenceRecord(x.by,'study:sign',x.at);
 x.basis=rec?{comp:rec.id,activity:'study:sign',from:rec.from,to:rec.to,checkedOn:x.at,by:x.by}:null;
