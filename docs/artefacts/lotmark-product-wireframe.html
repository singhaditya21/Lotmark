<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lotmark — Product Wireframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --ink:#1B2233;--ink2:#4A5468;--ink3:#6B7588;--line:#C9CFDA;--line2:#E2E6ED;
 --fill:#EFF1F5;--fill2:#F7F8FA;--page:#FFFFFF;--bg:#E9ECF1;
 --acc:#B85C00;--core:#0B6A4D;--coreT:#E2EFEA;--comm:#7A8296;--commT:#EDEFF3;
 --sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.skip{position:absolute;left:-9999px;background:#fff;padding:10px 16px;z-index:300;font-weight:600}.skip:focus{left:0;top:0}

/* chrome */
.bar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px;min-height:52px;flex-wrap:wrap}
.bar .lg{display:flex;align-items:center;gap:9px;font-weight:600;white-space:nowrap}
.mark{width:26px;height:26px;border-radius:5px;background:#fff;color:var(--ink);display:grid;place-items:center;font:700 11px var(--mono)}
.bar small{display:block;font:400 10px var(--sans);color:#9AA5BB;text-transform:uppercase;letter-spacing:.06em}
.seg{display:flex;gap:2px;background:rgba(255,255,255,.11);padding:3px;border-radius:7px}
.seg button{padding:5px 11px;border-radius:5px;font-size:12.5px;font-weight:500;color:#C4CDDD;white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600}
.barR{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fid{font:500 10.5px var(--mono);color:#9AA5BB;border:1px solid rgba(255,255,255,.25);border-radius:5px;padding:4px 8px}

.shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 52px)}
.rail{background:#fff;border-right:1px solid var(--line);padding:12px 10px 40px;overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
.rail h4{font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:14px 6px 5px}
.rail h4:first-child{margin-top:2px}
.rail button{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:12.5px;color:var(--ink2);margin-bottom:1px}
.rail button:hover{background:var(--fill2)}
.rail button[aria-current=page]{background:var(--ink);color:#fff;font-weight:600}
.rail .tag{font:600 8.5px var(--mono);padding:1px 4px;border-radius:3px}
.tag.core{background:var(--coreT);color:var(--core)}
.tag.comm{background:var(--commT);color:var(--comm)}
.rail button[aria-current=page] .tag{background:rgba(255,255,255,.2);color:#fff}

.stage{padding:20px 22px 70px;max-width:1180px}
.crumb{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
h1.t{font-size:21px;margin:4px 0 5px;letter-spacing:-.02em}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.pill{font:600 10px var(--mono);border-radius:12px;padding:2px 9px;background:#fff;border:1px solid var(--line);color:var(--ink2)}
.pill.core{background:var(--coreT);border-color:#B9D6CA;color:var(--core)}
.pill.comm{background:var(--commT);border-color:var(--line);color:var(--comm)}
.pill.iso{background:#FDF3E6;border-color:#EBD3B0;color:var(--acc)}
.lede{color:var(--ink2);max-width:78ch;margin:0 0 16px}

/* wireframe canvas */
.canvas{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:0;overflow:hidden;box-shadow:0 1px 3px rgba(27,34,51,.07)}
.wtop{background:var(--fill);border-bottom:1px solid var(--line);padding:9px 13px;display:flex;align-items:center;gap:10px;font:600 11.5px var(--mono);color:var(--ink2)}
.wtop .dots{display:flex;gap:4px}.wtop .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
.wbody{padding:16px}
.wf-sec{font:600 9.5px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin:16px 0 7px;padding-bottom:4px;border-bottom:1px solid var(--line2)}
.wf-sec:first-child{margin-top:0}
.wf-box{background:var(--fill2);border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;font:500 11px var(--mono);color:var(--ink3);text-align:center;padding:6px;position:relative}
.wf-img{background:repeating-linear-gradient(45deg,#F4F5F8,#F4F5F8 6px,#ECEEF3 6px,#ECEEF3 12px);border:1px solid var(--line);border-radius:4px;display:grid;place-items:center;font:500 10.5px var(--mono);color:var(--ink3)}
.wf-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:10px}
.wf-field{flex:1;min-width:130px}
.wf-field label{display:block;font:600 9.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-bottom:3px}
.wf-input{height:30px;background:#fff;border:1px solid var(--line);border-radius:4px}
.wf-input.ta{height:58px}
.wf-input.sel:after{content:'▾';float:right;margin:5px 8px 0 0;color:var(--ink3);font-size:11px}
.wf-btn{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:5px 11px;font:600 11px var(--sans);color:var(--ink2);background:#fff}
.wf-btn.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.wf-btn.g{background:var(--core);color:#fff;border-color:var(--core)}
.wf-btn.d{border-style:dashed;color:var(--ink3)}
table.wf{width:100%;border-collapse:collapse;font-size:11.5px;font-family:var(--mono)}
table.wf th{text-align:left;background:var(--fill);border:1px solid var(--line);padding:6px 8px;font-weight:600;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
table.wf td{border:1px solid var(--line2);padding:6px 8px;color:var(--ink3)}
table.wf td.s{background:var(--fill2)}
.wf-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.wf-tabs span{padding:7px 12px;font-size:12px;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.wf-tabs span.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.wf-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:12px}
.wf-kpi{border:1px solid var(--line);border-radius:5px;padding:9px;background:var(--fill2)}
.wf-kpi b{display:block;height:18px;width:52px;background:var(--line2);border-radius:3px;margin-top:5px}
.wf-kpi span{font:600 9px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.wf-chip{display:inline-block;border:1px solid var(--line);border-radius:11px;padding:1.5px 8px;font:600 9.5px var(--mono);color:var(--ink3);background:#fff}
.wf-list div{border:1px solid var(--line2);border-radius:4px;padding:8px 10px;margin-bottom:6px;font-size:11.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.split{display:grid;grid-template-columns:200px 1fr;gap:12px}
.ann{display:inline-grid;place-items:center;width:17px;height:17px;border-radius:50%;background:var(--acc);color:#fff;font:700 10px var(--mono);vertical-align:middle;margin:0 3px}
body.noann .ann{display:none}
.notes{margin-top:14px;background:#FDF7EF;border:1px solid #EBD9BE;border-radius:6px;padding:13px 15px}
body.noann .notes{display:none}
.notes h5{margin:0 0 8px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.notes ol{margin:0;padding-left:20px;font-size:12.5px;color:var(--ink2)}
.notes li{margin-bottom:5px}
.notes li b{color:var(--ink)}

/* sitemap */
.smgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:13px}
.smgrp{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.smgrp header{padding:10px 12px;border-bottom:1px solid var(--line2);background:var(--fill)}
.smgrp header b{display:block;font-size:13px}
.smgrp header span{font:600 9.5px var(--mono);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.smgrp ul{list-style:none;margin:0;padding:7px}
.smgrp li{padding:0}
.smgrp li button{display:flex;justify-content:space-between;width:100%;text-align:left;padding:6px 8px;border-radius:5px;font-size:12px;color:var(--ink2)}
.smgrp li button:hover{background:var(--fill2)}
.bnd{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.bnd .col{border-radius:8px;padding:14px;border:1px solid var(--line)}
.bnd .col.core{background:var(--coreT);border-color:#B9D6CA}
.bnd .col.comm{background:var(--commT)}
.bnd h3{margin:0 0 3px;font-size:15px}
.bnd p{margin:0 0 10px;font-size:12.5px;color:var(--ink2)}
.bnd ul{margin:0;padding-left:17px;font-size:12.5px;line-height:1.75}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
@media print{
 .bar,.rail,.pager,button{display:none!important}
 body{background:#fff;font-size:11pt}
 .stage{max-width:none;padding:0}
 .canvas,.smgrp,.bnd .col{border:1px solid #999;box-shadow:none;break-inside:avoid}
 .notes{background:#fff;border:1px solid #999}
 h1.t{page-break-after:avoid}
 table.wf{font-size:9pt}
}
@media(max-width:980px){.shell{grid-template-columns:1fr}.rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}
 .g2,.bnd,.split{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}}
</style>
<body>
<a class="skip" href="#stage">Skip to content</a>
<header class="bar">
 <div class="lg"><div class="mark" aria-hidden="true">LM</div><div>Lotmark<small>Reference material lifecycle platform</small></div></div>
 <div class="seg" role="group" aria-label="View"><button id="v-wire" aria-pressed="true" onclick="setView('wire')">Screens</button><button id="v-map" aria-pressed="false" onclick="setView('map')">Product map</button></div>
 <div class="barR">
  <div class="seg" role="group" aria-label="Annotations"><button id="a-on" aria-pressed="true" onclick="setAnn(true)">Notes on</button><button id="a-off" aria-pressed="false" onclick="setAnn(false)">Notes off</button></div>
  <span class="fid">low-fidelity wireframe</span></div>
</header>
<div class="shell"><nav class="rail" id="rail" aria-label="Screens"></nav><main class="stage" id="stage" tabindex="-1"></main></div>

<script>
/* ══════════ wireframe primitives ══════════ */
const W={
 sec:t=>`<div class="wf-sec">${t}</div>`,
 box:(l,h=54,extra='')=>`<div class="wf-box" style="height:${h}px;${extra}">${l||''}</div>`,
 img:(l,h=76)=>`<div class="wf-img" style="height:${h}px">${l}</div>`,
 row:(...k)=>`<div class="wf-row">${k.join('')}</div>`,
 fld:(l,f=1,kind='')=>`<div class="wf-field" style="flex:${f}"><label>${l}</label><div class="wf-input ${kind}"></div></div>`,
 btn:(l,k='')=>`<span class="wf-btn ${k}">${l}</span>`,
 chip:l=>`<span class="wf-chip">${l}</span>`,
 tabs:(a,i=0)=>`<div class="wf-tabs">${a.map((x,n)=>`<span class="${n===i?'on':''}">${x}</span>`).join('')}</div>`,
 kpis:a=>`<div class="wf-kpis">${a.map(l=>`<div class="wf-kpi"><span>${l}</span><b></b></div>`).join('')}</div>`,
 tbl:(cols,rows=4,fills={})=>`<table class="wf"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>
   ${Array.from({length:rows},(_,r)=>`<tr>${cols.map((c,i)=>`<td class="${i===0?'s':''}">${fills[i]&&fills[i][r]!==undefined?fills[i][r]:'&nbsp;'}</td>`).join('')}</tr>`).join('')}</tbody></table>`,
 list:a=>`<div class="wf-list">${a.map(([l,r])=>`<div><span>${l}</span><span>${r||''}</span></div>`).join('')}</div>`,
 ann:n=>`<span class="ann">${n}</span>`,
 win:(title,inner,chrome=true)=>`<div class="canvas">${chrome?`<div class="wtop"><span class="dots"><i></i><i></i><i></i></span>${title}</div>`:''}<div class="wbody">${inner}</div></div>`
};
const {sec,box,img,row,fld,btn,chip,tabs,kpis,tbl,list,ann,win}=W;

/* ══════════ screens ══════════ */
const SCREENS=[

/* ───────── 0 · FOUNDATION ───────── */
{id:'map',g:'Foundation',n:'Product map',kind:'',iso:'',roles:'',
 lede:'Twenty-three modules in five groups. The shading is the product decision: build the green, configure the grey.',
 render:()=>renderMap()+`<div class="notes" style="margin-top:14px"><h5>Companion artefacts</h5><ol>
   <li>The working application is <b>lotmark-app.html</b>. Its Build coverage screen maps every screen below to its implementation status, and that map is generated from this file rather than maintained by hand.</li>
   <li>The numbers on the Deployment scenarios and Market sizing screens come from <b>Lotmark_and_IPC_Estimate_v5.xlsx</b> and are injected by the build script, not typed in.</li></ol></div>`,notes:[]},

{id:'boundary',g:'Foundation',n:'Core vs commodity',kind:'',iso:'',roles:'',
 lede:'The IPC estimate put roughly 60% of effort into things Drupal and OpenCart already do. That is the part to stop building.',
 render:()=>`<div class="bnd">
  <div class="col core"><h3>Core — build</h3><p>Nothing off the shelf does this, and ISO 17034 obliges every accredited producer to do it somehow.</p>
   <ul><li>Production planning and study management</li><li>Property values with uncertainty budgets</li><li>Value authorisation, which cannot be subcontracted</li><li>Certificate generation and reissue control</li><li>Lot lifecycle, supersession and validity</li><li>Entitlement-based pricing</li><li>Cold-chain dispatch and excursion capture</li><li>Tamper-evident audit ledger</li><li>Clause-level conformance evidence</li></ul></div>
  <div class="col comm"><h3>Commodity — configure</h3><p>Mature products exist. Every hour spent building these is an hour not spent on the core.</p>
   <ul><li>Content management and publishing</li><li>Storefront, cart and checkout</li><li>Payment gateway</li><li>Forum, polls, events, recruitment</li><li>Video hosting and streaming</li><li>Site search</li><li>Email and SMS delivery</li><li>Analytics collection</li></ul></div></div>
  <div class="notes"><h5>Why this boundary</h5><ol>
   <li><b>The wedge is the green column.</b> A producer can adopt lot lifecycle, certificates and audit while keeping whatever storefront they already run. That is roughly a fifth of a full programme and it fixes the worst pain first.</li>
   <li><b>The grey column is where differentiation goes to die.</b> It is also where most of a bespoke government build's cost sits, which is why the same money buys so little distinctive capability.</li>
   <li><b>Integration, not replacement.</b> The product publishes catalogue and certificate data outward; it does not need to own the shop window.</li></ol></div>`,notes:[]},

/* ───────── A · PRODUCTION ───────── */
{id:'market',g:'Foundation',n:'Market sizing',kind:'',iso:'',roles:'',
 lede:'The gap I left open last time. ILAC publishes the number, and it is smaller than the pitch assumed — but it points at a second, much larger market sitting next to it.',
 render:()=>`
 ${sec('Counted, not estimated')}
 ${tbl(['Population','Count','Source','Confidence'],4,
  {0:['Reference material producers accredited under the ILAC MRA','Producers registered in COMAR (voluntary)','Certified reference materials listed in COMAR','Laboratories accredited to ISO/IEC 17025'],
   1:['320+','~220','~11,000','114,600+'],
   2:['ILAC Secretariat, 2025','BAM COMAR user guide','BAM COMAR user guide','ILAC Secretariat, 2025'],
   3:['authoritative','floor — voluntary listing','floor','authoritative']})}
 <p class="lede" style="margin-top:12px">Two things fall out immediately. A COMAR producer averages about fifty materials, while the one estate examined closely carries 1,341 — so producers vary by more than an order of magnitude and an average is useless for pricing. And the producer population is roughly <b>one three-hundred-and-fiftieth</b> the size of the laboratory population that consumes what they make.</p>

 ${sec('Model A — the producer platform '+ann(1))}
 ${tbl(['Step','Low','Base','High','Basis'],6,
  {0:['Producer universe','Addressable (enough SKUs to need a system)','Five-year penetration','Customers','Annual contract value','Annual recurring revenue'],
   1:['400','140','15%','21','$30k','$0.6M'],
   2:['550','190','25%','48','$60k','$2.9M'],
   3:['700','245','40%','98','$110k','$10.8M'],
   4:['320 accredited plus unaccredited producers','~35% carry enough materials to justify software','vertical SaaS into a known, listable population','','benchmarked against mid-market LIMS','']})}

 ${sec('Model B — the laboratory vault '+ann(2))}
 ${tbl(['Step','Low','Base','High','Basis'],6,
  {0:['Accredited laboratory universe','Addressable (holds enough standards to care)','Five-year penetration','Customers','Annual contract value','Annual recurring revenue'],
   1:['114,600','34,000','0.5%','170','$1.2k','$0.2M'],
   2:['114,600','46,000','2%','920','$3k','$2.8M'],
   3:['114,600','57,000','5%','2,850','$6k','$17.1M'],
   4:['ILAC MRA figure','~30-50% hold reference materials in quantity','self-serve, low touch','','per-laboratory subscription','']})}

 <div class="bnd" style="margin-top:16px">
  <div class="col core"><h3>What the numbers actually say</h3>
   <ul><li>The producer platform is a <b>listable</b> market — you can name every prospect — but a small one. Even at forty per cent penetration it tops out around ₹103 crore.</li>
   <li>The laboratory vault reaches a population 350 times larger with a product that is far cheaper to build, because it is a read-side surface over data producers already publish.</li>
   <li>Base cases land within touching distance of each other, so the choice is not about size today. It is about ceiling and about motion.</li></ul></div>
  <div class="col comm"><h3>The connection that decides it</h3>
   <ul><li>Every producer that adopts the platform hands over their customer list. One pharmacopoeia alone sells to hundreds of laboratories.</li>
   <li><b>The producer platform is the distribution channel for the vault.</b> Land the producer, then reach their buyers through the certificates they already send.</li>
   <li>That sequencing also fixes the vault's cold-start problem: a vault with no certificates in it is worthless, and producers supply the certificates.</li></ul></div></div>

 ${sec('Where this model now lives '+ann(4))}
 ${box('The revenue model — both sizing models, the contract-value assumptions and the ARR arithmetic — now lives in the Market & Revenue sheet of Lotmark_and_IPC_Estimate_v5.xlsx, alongside the cost side. The figures on this screen are injected from that sheet by sync_artefacts.py. The two halves of the business case are no longer in different file formats.',72)}

 ${sec('Verdict '+ann(3))}
 ${box('Build the producer platform because it is winnable and it names its own customers. Price it as a business, not as a land grab. Treat the laboratory vault as the second act it exists to unlock, and design the certificate and QR surfaces from day one so that act is possible.',72)}`,
 notes:['<b>These are counted figures with a stated method, not a market report.</b> The producer and laboratory populations come from ILAC directly. Everything below the first row of each model is an assumption, labelled as one, with the arithmetic visible so the numbers can be argued with.',
        '<b>The addressable filter is the weakest input in both models.</b> Nobody publishes how many materials a producer carries or how many standards a laboratory holds. Two customer conversations would replace both guesses.',
        '<b>The model is now in the workbook, not here.</b> Both sizing models were living in a design file while the cost side sat in a spreadsheet. They are now in one place, which is the only way the contradiction between the assumed contract value and the break-even is visible on a single screen.',
        '<b>A niche is not a failure.</b> A $3M ARR vertical business with 320 nameable prospects and a compliance-driven purchase is a good outcome. It is simply a different plan from one that assumes a large market, and the honest number should shape the plan before any money is spent.']},

{id:'schema',g:'Foundation',n:'Data model',kind:'core',iso:'',roles:'Architecture',
 lede:'Three questions the product must answer that no amount of later feature work can retrofit. Each depends on a relation existing in the schema on day one.',
 render:()=>`
 ${sec('Entities')}
 <div class="g4">
  ${[['Production','Project · Material · ProcessStep · Study · StudyResult · PropertyValue · UncertaintyComponent'],
     ['Certification','Certificate · CertificateIssue · Template · TemplateVersion · Authorisation'],
     ['Distribution','Sku · Lot · Unit · Order · OrderLine · Shipment · LoggerReading · Entitlement'],
     ['Governance','Person · Competence · Equipment · Calibration · Facility · Subcontractor · AuditEntry · Consent']]
   .map(([g,e])=>`<div style="border:1px solid var(--line);border-radius:5px;padding:10px">
     <div style="font:600 9.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:6px">${g}</div>
     <div style="font:400 11px var(--mono);color:var(--ink2);line-height:1.7">${e}</div></div>`).join('')}</div>

 ${sec('Closure 1 — retrospective equipment impact '+ann(1))}
 ${box('Equipment → Calibration (dated) → StudyResult → Study → Project → Lot → CertificateIssue',52)}
 ${list([['Question it answers','Which released lots relied on an instrument whose calibration has just been found to have lapsed?'],
         ['Breaks if','StudyResult stores the instrument as free text, or Calibration stores only current status rather than dated intervals'],
         ['Cost of adding later','Every historical study must be re-read and re-keyed, and most cannot be reconstructed at all']])}

 ${sec('Closure 2 — certificate holder list '+ann(2))}
 ${box('Lot → CertificateIssue (versioned) → OrderLine → Order → Customer → Contact',52)}
 ${list([['Question it answers','Who received issue 1 of a certificate that has now been reissued, and have they acknowledged it?'],
         ['Breaks if','OrderLine references a Sku rather than the Lot actually allocated, or Certificate is overwritten on reissue instead of versioned'],
         ['Cost of adding later','The historical holder list is unrecoverable, which is the one thing document control actually requires']])}

 ${sec('Closure 3 — competence at the moment of signing '+ann(3))}
 ${box('Person → Competence (activity, valid from, valid to) → Signature (snapshot) → Study | PropertyValue | CertificateIssue',52)}
 ${list([['Question it answers','Was the person who signed this study authorised for that activity on that date?'],
         ['Breaks if','Competence is a current-state flag rather than a dated record, or Signature does not snapshot the authorisation it relied on'],
         ['Cost of adding later','Every past signature becomes unverifiable, and an assessor will ask']])}

 ${sec('Schema rules that make the closures hold '+ann(4))}
 ${tbl(['Rule','Applies to','Why'],6,
  {0:['Temporal validity on every credential','Signature snapshots its basis','Versioned, never overwritten','Allocation recorded at the line','No soft delete on evidence','Append-only ledger with chained digests'],
   1:['Calibration, Competence, Entitlement, Subcontractor','Signature','CertificateIssue, TemplateVersion, PropertyValue','OrderLine','Study, PropertyValue, AuditEntry, Certificate','AuditEntry'],
   2:['Status must be answerable as at a past date, not only today','A later change to a competence record must not rewrite history','Reissue produces a diff; the prior issue stays retrievable','What shipped is the lot allocated, not the SKU ordered','Withdrawal is a state, not a disappearance','Tamper evidence has to be structural, not procedural']})}`,
 notes:['<b>This is the expensive one.</b> Referencing equipment as a record rather than a string costs nothing on day one and is close to unrecoverable afterwards, because the information was never captured in a form anything can query.',
        '<b>The holder list is why certification and distribution belong in one product.</b> Split them across two systems and this chain has a join nobody owns.',
        '<b>Dated competence, not a flag.</b> Almost every quality system stores training as current state. The question an assessor asks is about a date in the past, which a flag cannot answer.',
        '<b>These six rules are the whole architecture argument.</b> Everything else in the product is replaceable; a schema that cannot express these closures cannot be fixed by any amount of later feature work.']},
{id:'deploy',g:'Foundation',n:'Deployment scenarios',kind:'',iso:'',roles:'',
 lede:'One product, two ways it reaches a customer. The estimate workbook prices both, and the arithmetic is less comfortable than it first looks.',
 render:()=>`
 ${sec('The two routes')}
 <div class="bnd">
  <div class="col core"><h3>Product route</h3><p>The customer becomes a tenant. Configuration, not construction.</p>
   <ul><li>Core supplied: lots, studies, property values, authorisation, certificates, entitlement, dispatch, audit, conformance</li>
   <li>Customer configures: numbering series, storage classes, certificate template, residency, optional modules</li>
   <li>Customer still buys separately: portal and CMS, migration, certification, hosting, anything in the commodity column</li></ul></div>
  <div class="col comm"><h3>Bespoke route</h3><p>Everything built for one customer, which is where this work started.</p>
   <ul><li>Every module written from scratch against one requirement document</li>
   <li>No reuse, no second customer, no product asset at the end</li>
   <li>Cheaper to defend in a tender, more expensive to live with</li></ul></div></div>

 ${sec('What the numbers actually say '+ann(1))}
 ${tbl(['Route','Effort PD','Build INR Cr','Licence 5yr','All in 5yr','Reading'],6,
  {0:['Cost to build the product itself','A — two independent builds','B — bespoke unified build','C — bespoke, phase 1 only','D — replatform the estate','E — customer adopts the product'],
   1:['1,676','4,220','3,714','2,865','3,343','2,787'],
   2:['2.54','6.38','5.62','4.33','5.06','4.22'],
   3:['—','—','—','—','—','3.00'],
   4:['2.54','6.38','5.62','4.33','5.06','7.22'],
   5:['Less than one bespoke engagement','','The bid basis','Defers the AI layer and mobile','Unvalidated','Costs MORE at the assumed licence']})}

 ${sec('The uncomfortable finding '+ann(2))}
 ${box('Adopting the product removes only about a quarter of the build, because most of what a government customer needs — portal, CMS, bilingual content, migration, certification, hosting, mobile shell — was never product scope. At a sixty lakh annual licence, adoption costs more over five years than a bespoke build.',78)}
 ${sec('Break-even licence')}
 ${box('Roughly ₹28 lakh a year. Above it the customer is cheaper commissioning bespoke; below it, adopting wins.',52)}

 ${sec('Which resolves the pricing question '+ann(3))}
 ${list([['Break-even for the largest plausible tenant','about ₹28 lakh a year, roughly $34,000k'],
         ['Base annual contract value in the market model','$60k'],
         ['Implication','Either the market model prices too high, or the largest government producers are not the segment the product is priced for']])}`,
 notes:['<b>This table is the whole commercial argument in one place.</b> The product costs less to build than a single bespoke engagement was priced at, which is the case for building it. But it does not automatically make any one customer cheaper, which is the case against assuming adoption sells itself.',
        '<b>I had this wrong before modelling it.</b> I said adoption was probably the cheapest route on the board. Modelled per module, it is the most expensive of the five once the licence is counted. The reason is structural: the product core is a minority of a government portal programme.',
        '<b>The break-even is below the assumed price point.</b> That tension is real and unresolved. It is the single most useful thing to take into a customer conversation, because it is answerable only by asking what a producer would actually pay.']},
{id:'proj-list',g:'Production',n:'Production projects',kind:'core',iso:'ISO 17034 §7.2',roles:'RM Scientist · Production Lead',

        '<b>Fill order matters.</b> Homogeneity designs commonly sample by fill sequence, so the fill order is captured at packaging rather than reconstructed later.']},

{id:'homogeneity',g:'Production',n:'Homogeneity study',kind:'core',iso:'ISO 17034 §7.5',roles:'RM Scientist · Statistician',
 lede:'Between-unit and within-unit variation, with the uncertainty contribution the certificate will later carry.',
 render:()=>win('Lotmark › Production › PRJ-0414 › Studies › Homogeneity',
  `${row(fld('Design',1,'sel'),fld('Units selected',1),fld('Replicates per unit',1),fld('Method',2))}
   ${sec('Results '+ann(1))}
   <div class="g2"><div>${tbl(['Unit','Rep 1','Rep 2','Mean','s'],6,{0:['U-004','U-019','U-037','U-058','U-072','U-091']})}</div>
    <div>${img('Scatter — measured value by fill sequence, with control limits',150)}
     ${sec('ANOVA')}${list([['Between-unit MS','—'],['Within-unit MS','—'],['s(bb)','—'],['u(bb) contribution','—'],['Sufficiently homogeneous','—']])}</div></div>
   ${sec('Outcome')}${row(fld('Conclusion',3,'ta'),fld('Assessed by',1))}
   ${row(btn('Attach raw data'),btn('Sign off study','p'))+ann(2)}`),
 notes:['<b>u(bb) flows forward automatically.</b> The between-unit contribution computed here becomes a line in the uncertainty budget and then a number on the certificate. No re-keying, and no drift between the study and the document.',
        '<b>Sign-off is a person, not a checkbox.</b> The signer must hold the competence authorisation for this activity, checked against the personnel register at the moment of signing.']},

{id:'stability',g:'Production',n:'Stability studies',kind:'core',iso:'ISO 17034 §7.6',roles:'RM Scientist',
 lede:'Short-term transport stability and long-term storage stability. Together they set the validity period and the shipping class.',
 render:()=>win('Lotmark › Production › PRJ-0414 › Studies › Stability',
  tabs(['Short-term (transport)','Long-term (storage)','Ongoing monitoring'],1)+
  `${row(fld('Design',1,'sel'),fld('Storage condition',1,'sel'),fld('Timepoints',1),fld('Reference condition',1,'sel'))}
   <div class="g2"><div>${tbl(['Timepoint','Condition','Result','Δ from t0'],6,{0:['t0','1 mo','3 mo','6 mo','12 mo','24 mo']})}</div>
    <div>${img('Trend — property value over time with regression and confidence band',160)}
     ${list([['Slope','—'],['Slope significant','—'],['u(lts) contribution','—'],['Proposed shelf life','—']])}</div></div>
   ${sec('Derived controls '+ann(1))}
   ${row(fld('Validity period',1),fld('Storage class',1,'sel'),fld('Transport class',1,'sel'),fld('Excursion tolerance',1))}
   ${sec('Ongoing monitoring schedule '+ann(2))}
   ${tbl(['Next check','Units reserved','Owner','Alert'],2)}`),

        '<b>Post-release monitoring is a requirement, not an option.</b> Units are reserved at packaging and the schedule generates work automatically, because a lapsed monitoring point is a finding.']},

{id:'characterisation',g:'Production',n:'Characterisation',kind:'core',iso:'ISO 17034 §7.7',roles:'RM Scientist · Statistician',

  `${row(fld('Approach',2,'sel'),fld('Number of laboratories',1),fld('Number of methods',1))}

        '<b>Participant accreditation is verified, not asserted.</b> Laboratory records link to the subcontractor competence register with expiry dates.']},

{id:'values',g:'Production',n:'Property values and uncertainty',kind:'core',iso:'ISO 17034 §7.8, ISO Guide 35',roles:'Statistician · Technical Manager',

{id:'authorise',g:'Production',n:'Value authorisation',kind:'core',iso:'ISO 17034 §6.2 — non-subcontractable',roles:'Technical Manager',

{id:'lots',g:'Production',n:'Lot register',kind:'core',iso:'ISO 17034 §7.9',roles:'Production Lead · Stock Controller',

        '<b>Two signals nobody currently gets.</b> Expiry horizon and stock cover both derive from data the producer already has but cannot see together — the reason a standard can be out of stock while sitting near the top of the demand report.']},

{id:'cert-template',g:'Certification',n:'Certificate templates',kind:'core',iso:'',roles:'Technical Manager · Tenant Admin',
 lede:'Each producer certifies in their own format. Templates are the multi-tenant hinge — same engine, different house style.',

   <div class="g2"><div>${sec('Blocks')}${list([['Producer header','locked'],['Accreditation mark','locked'],['Property value table','required'],['Uncertainty statement','required'],['Traceability statement','required'],['Validity','required'],['Storage and transport','required'],['Instructions for use','optional'],['Safety','optional'],['Custom block','optional']])}${row(btn('Add block','d'))}</div>

   ${sec('Governance '+ann(2))}${row(fld('Template version',1),fld('Approved by',1),fld('Effective from',1),fld('Supersedes',1))}`),
 notes:['<b>Required blocks cannot be removed.</b> The template designer enforces the minimum content of a reference material certificate, so a tenant cannot style their way out of conformance.',
        '<b>Templates are versioned and approved.</b> A certificate records which template version produced it, so a reissue years later can reproduce the original faithfully.']},

{id:'cert-registry',g:'Certification',n:'Certificate registry and reissue',kind:'core',iso:'ISO 17034 §7.11',roles:'Technical Manager · Quality',
 lede:'Every certificate ever issued, what changed, and who holds an outdated copy.',

  row(fld('Search certificate, lot or material',3),fld('Status',1,'sel'),fld('Issued between',1))+
  tbl(['Certificate','Lot','Issue','Issued','Authorised by','Status','Holders notified'],6,
   {0:['CRT-2041','CRT-2042','CRT-2043','CRT-2044','CRT-2045','CRT-2046'],5:['current','current','reissued','withdrawn','current','current']})+
  `${sec('Reissue — CRT-2043 '+ann(1))}
   <div class="g2"><div>${sec('What changed')}${tbl(['Field','Issue 1','Issue 2'],3)}</div>
    <div>${sec('Notification '+ann(2))}${list([['Customers holding issue 1','—'],['Notified','—'],['Acknowledged','—'],['Outstanding','—']])}
     ${row(btn('Notify holders','p'),btn('Export holder list'))}</div></div>`),
 notes:['<b>Reissue produces a diff, not a replacement.</b> Both issues stay retrievable, and the difference is displayed rather than left for a customer to spot.',
        '<b>The holder list is the point.</b> A producer that cannot name who received a superseded certificate cannot demonstrate control of its documents. Order history makes that list computable, which is why certification and distribution belong in one product.']},

/* ───────── C · DISTRIBUTION ───────── */
{id:'catalogue',g:'Distribution',n:'Catalogue management',kind:'core',iso:'',roles:'Catalogue Manager',
 lede:'The saleable view of the lot register — what is listed, at what price, to whom.',
 render:()=>win('Lotmark › Distribution › Catalogue',
  tabs(['All items','Listed','Unlisted','Out of stock','Discontinued'],0)+
  row(fld('Search',3),fld('Category',1,'sel'),fld('Price tier',1,'sel'),btn('Bulk import'),btn('New item','p'))+
  ann(1)+tbl(['SKU','Material','Current lot','Unit','List price','Tiers','Availability','Listed'],6,

  `${sec('Bulk operations '+ann(2))}${row(btn('Import from spreadsheet','d'),btn('Export catalogue'),btn('Publish to storefront'),btn('Publish to API'))}`),

{id:'entitlement',g:'Distribution',n:'Customer entitlement',kind:'core',iso:'',roles:'Finance · Commercial',
 lede:'Who gets which price, on what evidence, and when that evidence expires.',
 render:()=>win('Lotmark › Distribution › Entitlement',
  tabs(['Queue','Approved','Expiring','Lapsed','Rejected'],0)+
  kpis(['Awaiting review','Approved','Expiring in 90 days','Lapsed','Median decision days'])+

   {0:['ENT-118','ENT-124','ENT-127','ENT-131','ENT-133'],6:['approved','in review','in review','expiring','lapsed']})+
  `${sec('ENT-124 '+ann(1))}
   <div class="g2"><div>${list([['Organisation','—'],['Tier claimed','Government'],['Discount effect','—'],['Evidence document','—'],['Verified against','—']])}
     ${box('Evidence viewer — uploaded recognition letter or notification',110)}</div>
    <div>${sec('Decision')}${row(fld('Checklist item 1',1,'sel'),fld('Checklist item 2',1,'sel'))}
     ${row(fld('Rationale',1,'ta'))}${row(fld('Revalidate after',1,'sel'))}

{id:'orders',g:'Distribution',n:'Orders',kind:'core',iso:'',roles:'Commercial · Finance',
 lede:'One ledger regardless of whether the order arrived through the storefront, the API, a purchase order or the phone.',
 render:()=>win('Lotmark › Distribution › Orders',

  ann(1)+tbl(['Order','Customer','Channel','Lines','Value','Tier','State','Cold chain'],6,

/* ══════════ views ══════════ */
const GROUPS=['Foundation','Production','Certification','Distribution','Compliance','Platform','Field'];
let S={id:'map',view:'wire',ann:true};

function renderMap(){
  const counts={};GROUPS.forEach(g=>counts[g]=SCREENS.filter(s=>s.g===g).length);
  return `<div class="smgrid">${GROUPS.map(g=>`<div class="smgrp">
    <header><b>${g}</b><span>${counts[g]} screen${counts[g]>1?'s':''}</span></header>
    <ul>${SCREENS.filter(s=>s.g===g).map(s=>`<li><button onclick="open_('${s.id}')">${s.n}
      ${s.kind?`<span class="tag ${s.kind}">${s.kind==='core'?'CORE':'CONFIG'}</span>`:''}</button></li>`).join('')}</ul></div>`).join('')}</div>
   <div class="notes" style="margin-top:16px"><h5>Reading the map</h5><ol>
    <li><b>Production through Certification is the half nobody sells.</b> Every module there exists because ISO 17034 obliges a producer to do it, and the tooling today is spreadsheets plus a LIMS that stops at the test result.</li>
    <li><b>Distribution is where the two IPC documents lived entirely.</b> They described the shop and the portal and never once mentioned homogeneity, stability, property values or authorisation — which is why the estimate carried a gap for the missing upstream source.</li>
    <li><b>Compliance is the reason to buy.</b> The other four groups make work faster; this one makes an accreditation assessment survivable.</li></ol></div>`;
}
function rail(){
  return GROUPS.map(g=>`<h4>${g}</h4>`+SCREENS.filter(s=>s.g===g).map(s=>
   `<button aria-current="${S.id===s.id?'page':'false'}" onclick="open_('${s.id}')"><span>${s.n}</span>
    ${s.kind?`<span class="tag ${s.kind}">${s.kind==='core'?'CORE':'CFG'}</span>`:''}</button>`).join('')).join('');
}
function open_(id){S.id=id;S.view='wire';paint();const el=document.getElementById('stage');if(el&&el.scrollIntoView)el.scrollIntoView({block:'start'});}
function setView(v){S.view=v;if(v==='map')S.id='map';paint();}
function setAnn(v){S.ann=v;document.body.classList.toggle('noann',!v);paint();}
function paint(){
  document.getElementById('v-wire').setAttribute('aria-pressed',S.view==='wire');
  document.getElementById('v-map').setAttribute('aria-pressed',S.view==='map');
  document.getElementById('a-on').setAttribute('aria-pressed',S.ann);
  document.getElementById('a-off').setAttribute('aria-pressed',!S.ann);
  document.getElementById('rail').innerHTML=rail();
  const s=SCREENS.find(x=>x.id===S.id)||SCREENS[0];
  const i=SCREENS.indexOf(s),prev=SCREENS[i-1],next=SCREENS[i+1];
  document.getElementById('stage').innerHTML=`
   <div class="crumb">${s.g}</div><h1 class="t">${s.n}</h1>
   <div class="meta">
    ${s.kind==='core'?'<span class="pill core">CORE — BUILD</span>':''}
    ${s.kind==='comm'?'<span class="pill comm">COMMODITY — CONFIGURE</span>':''}
    ${s.iso?`<span class="pill iso">${s.iso}</span>`:''}
    ${s.roles?`<span class="pill">${s.roles}</span>`:''}
    <span class="pill">${i+1} of ${SCREENS.length}</span></div>
   ${s.lede?`<p class="lede">${s.lede}</p>`:''}
   ${s.render()}
   ${s.notes&&s.notes.length?`<div class="notes"><h5>Design notes</h5><ol>${s.notes.map(n=>`<li>${n}</li>`).join('')}</ol></div>`:''}
   <div class="pager">
    ${prev?`<button class="wf-btn" onclick="open_('${prev.id}')">← ${prev.n}</button>`:'<span></span>'}
    ${next?`<button class="wf-btn" onclick="open_('${next.id}')">${next.n} →</button>`:'<span></span>'}</div>`;
}
document.addEventListener('keydown',e=>{
 if(e.target&&e.target.closest&&e.target.closest('input,textarea'))return;
 const i=SCREENS.findIndex(x=>x.id===S.id);
 if(e.key==='ArrowRight'&&SCREENS[i+1]){open_(SCREENS[i+1].id)}
 if(e.key==='ArrowLeft'&&SCREENS[i-1]){open_(SCREENS[i-1].id)}
});
paint();
</script>
</body></html>
