name: CI

# Every gate this codebase built for itself ran only when somebody typed it:
# the migration-checksum refusal, the OpenAPI drift test, the conformance
# register's evidence check, the RTM, and 590 tests. A broken commit was pushed
# from this repository the day before this file was written, and nothing caught
# it. That is what this is for.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        # 16, to match what the IQ protocol asserts and what the schema uses
        # (generated columns, `WITH (FORCE)` on DROP DATABASE, jsonb paths).
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # PGHOST/PGUSER, not DATABASE_URL, are what let the privileged connections
      # work. The API suite's global setup creates a template and clones one
      # database per worker over `postgres://localhost:5432/...` — no user in the
      # URL — so it connects as PGUSER, which on the CI service is `postgres`.
      PGHOST: localhost
      PGUSER: postgres

      # The job default is the APPLICATION role, deliberately not a superuser,
      # because the db suite's `createClient()` falls back to exactly this
      # (`client.ts` DEFAULT_URL) and its whole subject is what a non-superuser
      # can and cannot see. A superuser here bypasses row-level security
      # UNCONDITIONALLY, so `postgres://postgres@...` — the first value this line
      # held — turned every isolation and append-only test green-to-red the
      # moment CI first ran: an unfiltered select returned all six tenants'
      # rows, and the privilege REVOKEs a superuser ignores stopped throwing.
      # Migrate and seed, which need DDL and TRUNCATE, override this per step.
      DATABASE_URL: postgres://lotmark_app@localhost:5432/lotmark_dev

    steps:
      - uses: actions/checkout@v7

      # No `version:` here. package.json pins `packageManager: pnpm@9.15.9`,
      # and action-setup refuses outright when both are given:
      # "Multiple versions of pnpm specified". Every CI run since Actions were
      # first enabled on this repository failed at this step, before installing
      # anything — so the gate this file exists to be had never once run.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types first: a type error fails every suite below in a less readable
      # way, so it is worth failing on its own.
      - run: pnpm -r typecheck

      - name: Create the development database the db suite uses
        run: psql -c 'CREATE DATABASE lotmark_dev'

      - name: Migrate and seed it
        # As the OWNER, not the app role. Migrate runs DDL and seed runs
        # TRUNCATE, both of which the application role deliberately cannot do —
        # so this is the one place that overrides the job's non-superuser
        # default. `migrate()`/`seed` read DATABASE_URL before their ADMIN_URL
        # fallback, so setting it here is enough.
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/lotmark_dev
        run: |
          pnpm --filter @lotmark/db migrate
          pnpm --filter @lotmark/db seed

      # The API suite ignores DATABASE_URL: its global setup builds a template
      # and clones a database per worker. The db suite uses the one above, and
      # rolls back everything it does.
      - run: pnpm -r test

      # Installation qualification: roles are not superusers, row-level
      # security is forced everywhere, PUBLIC can execute nothing, the
      # append-only tables really are.
      - run: pnpm --filter @lotmark/api iq

      # The generated documents must match what generated them. Both write into
      # the working tree, so a diff means somebody changed the source and not
      # the artefact.
      - name: Regenerate the API description and the traceability matrix
        run: |
          pnpm --filter @lotmark/api openapi
          pnpm --filter @lotmark/api rtm
      - name: Fail if either is out of date
        run: git diff --exit-code -- docs/api/openapi.json docs/validation/RTM.md

  # veraPDF needs a JRE, which the job above does not have. Kept separate so the
  # main check does not carry a Java toolchain it otherwise has no use for, and
  # so this can be allowed to fail loudly while the gate is still being taught
  # to run here.
  pdfa:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # No `version:` here. package.json pins `packageManager: pnpm@9.15.9`,
      # and action-setup refuses outright when both are given:
      # "Multiple versions of pnpm specified". Every CI run since Actions were
      # first enabled on this repository failed at this step, before installing
      # anything — so the gate this file exists to be had never once run.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - name: PDF/A conformance
        run: pnpm --filter @lotmark/api pdfa
